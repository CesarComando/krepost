<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Крепость сквозь время</title>
<link rel="icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#17130f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Крепость">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#17130f; --panel:#262019; --line:#40362a; --text:#f2e8d8; --muted:#b5a68f; --accent:#d9a441; --ok:#8fbf6a; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--text); font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  button,label.btn { font:inherit; cursor:pointer; border:0; border-radius:10px; padding:12px 16px; background:var(--panel); color:var(--text); display:inline-block; text-align:center; }
  button.main,label.btn { background:var(--accent); color:#1d1608; font-weight:600; }
  .screen { height:100dvh; display:flex; flex-direction:column; }
  .screen[hidden] { display:none; }

  #list { overflow-y:auto; padding:20px 16px 32px; }
  #list h1 { font:600 28px/1.15 Georgia,"Times New Roman",serif; margin:0 0 6px; }
  #list .sub { color:var(--muted); margin:0 0 4px; }
  #progress { color:var(--accent); margin:0 0 16px; font-weight:600; }
  #cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:14px; margin-bottom:18px; }
  .card { position:relative; background:var(--panel); border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  .card .open { display:block; width:100%; padding:0; border-radius:0; background:none; text-align:left; }
  .card img { display:block; width:100%; height:170px; object-fit:cover; filter:sepia(.35); }
  .card .info { padding:10px 12px 12px; }
  .card .name { font-weight:600; }
  .card .meta { color:var(--muted); font-size:14px; }
  .card .credit { color:var(--muted); font-size:12px; opacity:.8; margin-top:4px; }
  .card .done { color:var(--ok); font-size:14px; font-weight:600; }
  .card .del { position:absolute; top:6px; right:6px; width:34px; height:34px; padding:0; border-radius:50%; background:rgba(0,0,0,.65); }
  #empty { color:var(--muted); padding:28px 16px; border:1px dashed var(--line); border-radius:12px; text-align:center; margin-bottom:18px; }
  label.btn[hidden] { display:none; }
  #adminBar { position:sticky; top:-20px; z-index:5; display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 12px; margin-bottom:14px; background:var(--panel); border:1px solid var(--accent); border-radius:10px; font-weight:600; }
  #adminBar[hidden] { display:none; }
  #installBox { margin:4px 0 14px; }
  #installBox[hidden], #installHelp[hidden] { display:none; }
  #installHelp { color:var(--muted); font-size:14px; margin:8px 0 0; }
  #chips { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px; }
  .chip { padding:8px 12px; font-size:14px; border-radius:18px; border:1px solid var(--line); }
  .chip.on { background:var(--accent); color:#1d1608; border-color:var(--accent); font-weight:600; }
  .groupTitle { grid-column:1/-1; font:600 22px/1.2 Georgia,"Times New Roman",serif; margin:10px 0 0; }
  .cardActions { display:flex; flex-wrap:wrap; align-items:center; gap:8px; padding:0 12px 12px; }
  .been { padding:8px 12px; font-size:14px; border:1px solid var(--line); }
  .been.on { color:var(--ok); border-color:var(--ok); font-weight:600; }
  .map { color:var(--accent); font-size:14px; }
  .map[hidden] { display:none; }
  .card.off { opacity:.35; }
  .card .toggle { position:absolute; top:6px; right:6px; padding:8px 12px; font-size:14px; background:rgba(0,0,0,.75); }
  #addInput { position:absolute; opacity:0; width:1px; height:1px; }
  /* Моя библиотека — свои снимки «тогда и сейчас» */
  #tabs { display:flex; gap:8px; margin:0 0 16px; }
  .tab { flex:1; padding:12px 10px; font-weight:600; border:1px solid var(--line); }
  .tab.on { background:var(--accent); color:#1d1608; border-color:var(--accent); }
  #lib { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:14px; margin-bottom:18px; }
  #lib[hidden], #cards[hidden], #chips[hidden] { display:none; }
  .shot .pair { position:relative; }
  .shot .pair img.now { filter:none; }
  .shot .pair img.old { position:absolute; left:8px; bottom:8px; width:34%; height:auto; aspect-ratio:4/3; object-fit:cover; border:2px solid var(--text); border-radius:6px; box-shadow:0 2px 8px rgba(0,0,0,.6); }
  .libEmpty { grid-column:1/-1; color:var(--muted); padding:28px 16px; border:1px dashed var(--line); border-radius:12px; text-align:center; }

  .bar { display:flex; align-items:center; gap:10px; padding:10px 12px; background:var(--bg); }
  .bar .title { flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-weight:600; }
  #camArea,#resArea { flex:1; min-height:0; display:flex; align-items:center; justify-content:center; background:#000; }
  .stage { position:relative; overflow:hidden; background:#000; }
  .stage video,.stage img { position:absolute; inset:0; width:100%; height:100%; display:block; }
  .stage video { object-fit:cover; transform-origin:50% 50%; }
  .stage { touch-action:none; }
  .stage img { object-fit:fill; }
  #camMsg { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; padding:20px; text-align:center; background:rgba(0,0,0,.72); }
  #camMsg[hidden] { display:none; }
  .controls { padding:10px 16px calc(14px + env(safe-area-inset-bottom)); background:var(--bg); }
  .controls .row { display:flex; align-items:center; gap:10px; color:var(--muted); font-size:14px; }
  .controls input[type=range] { flex:1; accent-color:var(--accent); height:32px; }
  .controls .hint { color:var(--muted); font-size:14px; text-align:center; margin:2px 0 10px; }
  .actions { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
  /* Телефон лёжа: кнопка «снять» сбоку, под большой палец. По умолчанию справа, «⇄» — переставить налево (для левши). */
  #handSwap { display:none; }
  @media (orientation: landscape) and (max-height: 600px) {
    #cam.screen { display:grid; grid-template-columns:minmax(0,1fr) 230px; grid-template-rows:auto minmax(0,1fr); }
    #cam .bar { grid-column:1 / -1; padding:4px 12px; }
    #cam .bar button { padding:6px 12px; }
    #cam #camArea { grid-row:2; grid-column:1; }
    #cam .controls { grid-row:2; grid-column:2; display:flex; flex-direction:column; justify-content:center; gap:14px;
      padding:10px max(12px, env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) 12px; }
    #cam .controls .hint { margin:0; font-size:13px; }
    #cam .controls .row { font-size:13px; gap:6px; }
    #cam .controls input[type=range] { min-width:0; width:100%; }
    #cam .actions { flex-direction:column; align-items:stretch; }
    #cam #shoot { min-height:76px; font-size:18px; border-radius:18px; }
    #handSwap { display:block; align-self:center; }
    #cam.left { grid-template-columns:230px minmax(0,1fr); }
    #cam.left #camArea { grid-column:2; }
    #cam.left .controls { grid-column:1; padding-left:max(12px, env(safe-area-inset-left)); padding-right:12px; }
  }
  #shoot { min-width:190px; }
  #cmpRange { position:absolute; inset:0; width:100%; height:100%; margin:0; opacity:0; cursor:ew-resize; }
  #cmpLine { position:absolute; top:0; bottom:0; width:2px; background:var(--accent); pointer-events:none; }
  .tag { position:absolute; bottom:8px; padding:2px 8px; border-radius:6px; background:rgba(0,0,0,.65); font-size:13px; pointer-events:none; }

  /* ===== Дизайн 10.11.2026 (макет Nano Banana): архив, старое золото, Playfair + Inter ===== */
  :root { --gold-dim:rgba(217,164,65,.22); --serif:"Playfair Display",Georgia,"Times New Roman",serif; }
  html,body { font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  body::after { content:""; position:fixed; inset:0; pointer-events:none; z-index:1000; opacity:.05;
    background-image:url('data:image/svg+xml;utf8,<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="4" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(%23n)"/></svg>'); }
  button,label.btn { border-radius:12px; }
  button.main,label.btn { box-shadow:0 0 14px rgba(217,164,65,.28); }
  button:active { filter:brightness(.9); }
  #list h1, .groupTitle, .card .name { font-family:var(--serif); }
  #list h1 { font-size:30px; font-weight:600; }
  /* прогресс */
  #progress { display:flex; justify-content:space-between; font-size:14px; font-weight:500; margin:10px 0 6px; }
  #progress .lbl { color:var(--muted); }
  #progress .num { color:var(--accent); }
  #list > * { flex-shrink:0; }
  #progressBar { height:6px; border-radius:3px; background:rgba(242,232,216,.2); overflow:hidden; margin:0 0 16px; }
  #progressBar i { display:block; height:100%; background:var(--accent); border-radius:3px; transition:width .4s; }
  /* фильтры в одну строку с прокруткой */
  #chips { flex-wrap:nowrap; overflow-x:auto; scrollbar-width:none; margin:0 -16px 16px; padding:2px 16px; }
  #chips::-webkit-scrollbar { display:none; }
  .chip { white-space:nowrap; flex:none; border-radius:999px; background:var(--panel); border-color:var(--gold-dim); color:var(--muted); }
  .chip.on { color:#1d1608; }
  .tab { border-color:var(--gold-dim); background:var(--panel); }
  /* карточки */
  #cards, #lib { grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:18px; }
  .card { border-radius:18px; border-color:var(--gold-dim); padding:12px; }
  .card .open { border-radius:12px; }
  .card .imgbox { position:relative; border-radius:12px; overflow:hidden; }
  .card img { height:190px; border-radius:12px; filter:sepia(.45); }
  .shot .pair img.now { border-radius:12px; }
  .card .year { position:absolute; top:8px; right:8px; background:rgba(0,0,0,.6); backdrop-filter:blur(4px); padding:3px 8px; border-radius:6px; font-size:12px; }
  .card .info { padding:12px 4px 10px; }
  .card .name { font-size:20px; font-weight:600; line-height:1.2; margin-bottom:4px; }
  .cardActions { padding:0 4px 2px; flex-wrap:nowrap; }
  .been { flex:1; padding:12px; border-radius:12px; border:1px solid var(--gold-dim); background:transparent; font-weight:500; }
  .been.on { background:var(--accent); color:#1d1608; border-color:var(--accent); }
  .map { flex:none; width:48px; height:46px; display:flex; align-items:center; justify-content:center; border:1px solid var(--gold-dim); border-radius:12px; }
  .map svg { width:22px; height:22px; }
  .card .toggle { top:18px; right:18px; }
  /* верхние полосы экранов */
  .bar { padding:12px 14px; }
  .bar .title { font-family:var(--serif); font-size:19px; }
  #camBack, #resBack { width:46px; height:46px; padding:0; border-radius:50%; border:1px solid var(--gold-dim); font-size:20px; flex:none; }
  /* камера */
  #cam .controls, #result .controls { background:linear-gradient(to top, #000 0%, rgba(23,19,15,.96) 100%); }
  .controls .row { margin-bottom:4px; }
  #shoot { width:100%; max-width:420px; padding:16px; font-size:17px; }
  input[type=range] { accent-color:var(--accent); }
  /* результат: ползунок с ручкой ↔ */
  #resArea { padding:0 14px; background:var(--bg); }
  #resStage { border-radius:16px; border:1px solid var(--gold-dim); }
  #cmpLine { width:4px; margin-left:-2px; box-shadow:0 0 10px rgba(0,0,0,.5); }
  #cmpLine::after { content:"↔"; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:34px; height:34px; border-radius:50%;
    background:var(--accent); color:#17130f; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:18px; box-shadow:0 2px 6px rgba(0,0,0,.4); }
  #result .actions button { flex:1; max-width:220px; }
  #toList { display:block; margin:8px auto 0; background:none; color:var(--muted); font-size:14px; padding:6px; text-decoration:underline; text-underline-offset:4px; }
</style>
</head>
<body>

<section id="list" class="screen">
  <h1>Крепость сквозь время</h1>
  <p class="sub">Найди в Даугавпилсской крепости место со старой фотографии и встань точно туда, откуда снимал фотограф.</p>
  <div id="installBox" hidden>
    <button id="installBtn" class="main">Скачать на телефон</button>
    <p id="installHelp" hidden></p>
  </div>
  <div id="progress"></div>
  <div id="progressBar"><i></i></div>
  <div id="tabs" role="tablist">
    <button class="tab on" data-view="all" role="tab">Все места</button>
    <button class="tab" data-view="lib" role="tab">Моя библиотека<span id="libCount"></span></button>
  </div>
  <div id="adminBar" hidden>
    <span id="adminCount"></span>
    <button id="adminCopy">Скопировать список</button>
  </div>
  <div id="chips"></div>
  <div id="cards"></div>
  <div id="lib" hidden></div>
  <div id="empty" hidden>Пока нет ни одного фото. Добавьте старый снимок, чтобы попробовать.</div>
  <label class="btn" for="addInput">+ Добавить старое фото</label>
  <input id="addInput" type="file" accept="image/*">
</section>

<section id="cam" class="screen" hidden>
  <div class="bar">
    <button id="camBack" aria-label="Назад">←</button>
    <div class="title" id="camTitle"></div>
  </div>
  <div id="camArea">
    <div class="stage" id="camStage">
      <video id="video" playsinline muted autoplay></video>
      <img id="oldImg" alt="Старая фотография">
      <div id="camMsg" hidden></div>
    </div>
  </div>
  <div class="controls">
    <p class="hint" id="camHint"></p>
    <div class="row">
      <span>Сейчас</span>
      <input id="opacity" type="range" min="0" max="100" value="50" aria-label="Прозрачность старого фото">
      <span>Тогда</span>
    </div>
    <div class="row">
      <span aria-hidden="true">🔍</span>
      <input id="zoom" type="range" min="1" max="4" step="0.1" value="1" aria-label="Увеличение камеры">
      <span id="zoomVal" style="min-width:3.2em;text-align:right">1×</span>
    </div>
    <div class="actions"><button id="shoot" class="main">Совпало — сделать фото</button>
      <button id="handSwap" aria-label="Перенести кнопку на другую сторону">⇄ Кнопка слева</button></div>
  </div>
</section>

<section id="result" class="screen" hidden>
  <div class="bar">
    <button id="resBack" aria-label="К списку">←</button>
    <div class="title" id="resTitle"></div>
  </div>
  <div id="resArea">
    <div class="stage" id="resStage">
      <img id="cmpNow" alt="Снимок сейчас">
      <img id="cmpOld" alt="Старая фотография">
      <div id="cmpLine"></div>
      <span class="tag" style="left:8px">Тогда</span>
      <span class="tag" style="right:8px">Сейчас</span>
      <input id="cmpRange" type="range" min="0" max="100" value="50" aria-label="Сравнение тогда и сейчас">
    </div>
  </div>
  <div class="controls">
    <p class="hint">↔ Потяните ползунок, чтобы сравнить</p>
    <div class="actions">
      <button id="save" class="main">Сохранить</button>
      <button id="share">Поделиться</button>
      <button id="retry">Переснять</button>
    </div>
    <button id="toList">Вернуться к списку</button>
  </div>
</section>

<script src="spots.js"></script>
<script>
/* Точки маршрута лежат в spots.js, снимки — в папке photos. */
const SPOTS = window.SPOTS_DATA || [];

const ADDED_KEY = 'krepost.added', FOUND_KEY = 'krepost.found';
const $ = id => document.getElementById(id);

function read(key, fallback) {
  try { return JSON.parse(localStorage.getItem(key)) || fallback; } catch { return fallback; }
}
function write(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); return true; } catch { return false; }
}

let added = read(ADDED_KEY, []);
let found = read(FOUND_KEY, []);
let current = null, stream = null, nowUrl = null, camToken = 0;

/* Режим админа: открыть сайт с ?admin=1. Скрывает снимки только в этом браузере. */
const HIDDEN_KEY = 'krepost.hidden';
const ADMIN = new URLSearchParams(location.search).has('admin');
let hiddenIds = read(HIDDEN_KEY, []).filter(id => SPOTS.some(s => s.id === id));

const GEO_KEY = 'krepost.geo';
let geo = read(GEO_KEY, {});
const coordsOf = s => geo[s.id] || (s.lat != null ? { lat: s.lat, lng: s.lng } : null);

const ALL = 'Все';
const GROUPS = ['Михайловские ворота', 'Николаевские ворота', 'Константиновские ворота', 'Александровские ворота', 'Ворота (уточнить)', 'Инженерный арсенал', 'Собор', 'Редюиты и валы', 'Комендантский сад и парк', 'Мосты и дороги', 'Улицы и здания', 'Солдаты и люди', 'Виды сверху', 'Другое'];
const groupOf = s => s.group || 'Другое';
let activeGroup = ALL;

const visibleSpots = () => allSpots().filter(s => ADMIN || !hiddenIds.includes(s.id));

function updateProgress() {
  const spots = visibleSpots();
  const doneCount = spots.filter(s => found.includes(s.id)).length;
  $('progress').innerHTML = spots.length ? `<span class="lbl">Уже посетили:</span><span class="num">${doneCount} из ${spots.length}</span>` : '';
  $('progressBar').firstElementChild.style.width = spots.length ? (100 * doneCount / spots.length).toFixed(1) + '%' : '0';
}

function renderChips(spots) {
  const box = $('chips');
  box.replaceChildren();
  if (!SPOTS.length) return;
  const counts = {};
  for (const s of spots) counts[groupOf(s)] = (counts[groupOf(s)] || 0) + 1;
  const names = [ALL, ...GROUPS.filter(g => counts[g])];
  for (const name of names) {
    const chip = document.createElement('button');
    chip.className = 'chip' + (name === activeGroup ? ' on' : '');
    chip.textContent = `${name} ${name === ALL ? spots.length : counts[name]}`;
    chip.onclick = () => {
      activeGroup = name;
      renderList();
      $('list').scrollTop = 0;
    };
    box.append(chip);
  }
}

function cardActions(spot) {
  const row = document.createElement('div');
  row.className = 'cardActions';

  const been = document.createElement('button');
  const paintBeen = () => {
    const on = found.includes(spot.id);
    been.className = on ? 'been on' : 'been';
    been.textContent = on ? 'Был здесь ✓' : 'Уже был здесь';
  };
  been.onclick = () => {
    found = found.includes(spot.id) ? found.filter(f => f !== spot.id) : [...found, spot.id];
    write(FOUND_KEY, found);
    paintBeen();
    updateProgress();
  };
  paintBeen();
  row.append(been);

  const map = document.createElement('a');
  map.className = 'map';
  map.target = '_blank';
  map.rel = 'noopener';
  map.setAttribute('aria-label', 'На карте');
  map.innerHTML = '<svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a2 2 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>';
  const paintMap = () => {
    const p = coordsOf(spot);
    map.hidden = !p;
    if (p) map.href = `https://www.google.com/maps?q=${p.lat},${p.lng}`;
  };
  paintMap();

  if (ADMIN) {
    const pin = document.createElement('button');
    const paintPin = () => {
      const p = geo[spot.id];
      pin.className = p ? 'been on' : 'been';
      pin.textContent = p ? `Точка ±${p.acc} м` : 'Указать геолокацию';
    };
    pin.onclick = () => {
      if (!navigator.geolocation) { alert('Этот браузер не умеет определять место.'); return; }
      if (geo[spot.id] && !confirm('Заменить сохранённую точку на текущее место?')) return;
      pin.textContent = 'Определяем…';
      navigator.geolocation.getCurrentPosition(pos => {
        geo = { ...geo, [spot.id]: {
          lat: +pos.coords.latitude.toFixed(6),
          lng: +pos.coords.longitude.toFixed(6),
          acc: Math.round(pos.coords.accuracy)
        } };
        write(GEO_KEY, geo);
        if (!found.includes(spot.id)) { found = [...found, spot.id]; write(FOUND_KEY, found); paintBeen(); updateProgress(); }
        paintPin(); paintMap(); paintUnpin(); updateAdminBar();
      }, err => {
        paintPin();
        alert(err.code === 1 ? 'Нет разрешения на геолокацию. Разрешите её в настройках браузера.' : 'Не получилось определить место. Попробуйте ещё раз на открытом месте.');
      }, { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 });
    };
    paintPin();
    row.append(pin);

    // Ошибся точкой — сбросить и указать заново
    const unpin = document.createElement('button');
    unpin.className = 'been';
    unpin.textContent = 'Сбросить точку';
    const paintUnpin = () => { unpin.hidden = !geo[spot.id]; };
    unpin.onclick = () => {
      if (!confirm('Убрать сохранённую точку для этого снимка?')) return;
      const { [spot.id]: _, ...rest } = geo;
      geo = rest;
      write(GEO_KEY, geo);
      paintPin(); paintMap(); paintUnpin(); updateAdminBar();
    };
    paintUnpin();
    row.append(unpin);
  }

  row.append(map);
  return row;
}

function updateAdminBar() {
  if (!ADMIN) return;
  $('adminBar').hidden = false;
  $('adminCount').textContent = `Убрано: ${hiddenIds.length} из ${allSpots().length} · Точек: ${Object.keys(geo).length}`;
}

$('adminCopy').onclick = async () => {
  const lines = [];
  if (hiddenIds.length) lines.push('Убрать из приложения: ' + hiddenIds.join(', '));
  const pts = Object.entries(geo);
  if (pts.length) lines.push('Геолокация: ' + pts.map(([id, p]) => `${id} ${p.lat},${p.lng} ±${p.acc}`).join('; '));
  const text = lines.length ? lines.join('\n') : 'Пока ничего не отмечено';
  try {
    await navigator.clipboard.writeText(text);
    $('adminCopy').textContent = 'Скопировано';
    setTimeout(() => { $('adminCopy').textContent = 'Скопировать список'; }, 2000);
  } catch {
    prompt('Скопируйте этот список:', text);
  }
};

const allSpots = () => [...SPOTS, ...added];

function show(id) {
  for (const s of document.querySelectorAll('.screen')) s.hidden = s.id !== id;
}

/* ===== Моя библиотека: снимки, сделанные в приложении, хранятся в телефоне (IndexedDB) ===== */
let view = 'all';
const LIB_DB = 'krepost-lib';
function libDb() {
  return new Promise((res, rej) => {
    const r = indexedDB.open(LIB_DB, 1);
    r.onupgradeneeded = () => r.result.createObjectStore('shots', { keyPath: 'id', autoIncrement: true });
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
async function libTx(mode, fn) {
  const db = await libDb();
  return new Promise((res, rej) => {
    const tx = db.transaction('shots', mode);
    const out = fn(tx.objectStore('shots'));
    tx.oncomplete = () => res(out && 'result' in out ? out.result : undefined);
    tx.onerror = () => rej(tx.error);
  });
}
const libAdd = rec => libTx('readwrite', s => s.add(rec));
const libAll = () => libTx('readonly', s => s.getAll());
const libDel = id => libTx('readwrite', s => s.delete(id));
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch { /* не страшно */ }

let libUrls = [];
async function updateLibCount() {
  try { const n = (await libAll()).length; $('libCount').textContent = n ? ` · ${n}` : ''; } catch { /* нет IndexedDB */ }
}
async function renderLib() {
  const box = $('lib');
  libUrls.forEach(u => URL.revokeObjectURL(u)); libUrls = [];
  let shots = [];
  try { shots = await libAll(); } catch {
    box.innerHTML = '<div class="libEmpty">Этот браузер не даёт хранить снимки. Откройте приложение в Chrome.</div>'; return;
  }
  box.replaceChildren();
  $('libCount').textContent = shots.length ? ` · ${shots.length}` : '';
  if (!shots.length) {
    box.innerHTML = '<div class="libEmpty">Здесь будут ваши снимки «тогда и сейчас». Откройте старое фото, встаньте на то же место и нажмите «Совпало — снять».</div>';
    return;
  }
  shots.sort((a, b) => b.at - a.at);
  for (const shot of shots) {
    const spot = allSpots().find(s => s.id === shot.spotId) || { id: shot.spotId, title: shot.title, year: shot.year, src: shot.src };
    const url = URL.createObjectURL(shot.now); libUrls.push(url);
    const card = document.createElement('div');
    card.className = 'card shot';
    const open = document.createElement('button');
    open.className = 'open';
    open.onclick = () => openResult(spot, url, shot.id);
    const pair = document.createElement('div'); pair.className = 'pair';
    const now = document.createElement('img'); now.className = 'now'; now.src = url; now.alt = 'Сейчас';
    const old = document.createElement('img'); old.className = 'old'; old.src = spot.thumb || spot.src; old.alt = 'Тогда'; old.loading = 'lazy';
    pair.append(now, old);
    const info = document.createElement('div'); info.className = 'info';
    const name = document.createElement('div'); name.className = 'name'; name.textContent = spot.title;
    const meta = document.createElement('div'); meta.className = 'meta';
    meta.textContent = 'Снято ' + new Date(shot.at).toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' });
    info.append(name, meta);
    open.append(pair, info);
    const row = document.createElement('div'); row.className = 'cardActions';
    const cmp = document.createElement('button'); cmp.className = 'been'; cmp.textContent = 'Сравнить';
    cmp.onclick = () => openResult(spot, url, shot.id);
    const del = document.createElement('button'); del.className = 'been'; del.textContent = 'Удалить';
    del.onclick = async () => {
      if (!confirm('Удалить этот снимок из библиотеки? Вернуть его будет нельзя.')) return;
      await libDel(shot.id); renderLib();
    };
    row.append(cmp, del);
    card.append(open, row);
    box.append(card);
  }
}
function setView(v) {
  view = v;
  for (const b of document.querySelectorAll('.tab')) b.classList.toggle('on', b.dataset.view === v);
  const lib = v === 'lib';
  $('lib').hidden = !lib;
  $('cards').hidden = lib; $('chips').hidden = lib;
  document.querySelector('label.btn[for=addInput]').style.display = lib ? 'none' : '';
  if (lib) { $('empty').hidden = true; renderLib(); } else renderList();
}
for (const b of document.querySelectorAll('.tab')) b.onclick = () => setView(b.dataset.view);

/* Открыть пару «тогда / сейчас» на экране сравнения (из библиотеки или сразу после съёмки) */
function openResult(spot, url, shotId) {
  current = spot;
  nowUrl = url;
  $('cmpNow').src = url;
  $('cmpOld').src = spot.src;
  $('resTitle').textContent = spot.title;
  $('cmpRange').value = 50;
  setCompare(50);
  show('result');
  const img = $('oldImg');
  if (img.getAttribute('src') !== spot.src) { img.src = spot.src; img.decode().then(refit, refit); } else refit();
}

function renderList() {
  if (view === 'lib') { updateProgress(); renderLib(); return; }
  updateLibCount();
  const box = $('cards');
  box.replaceChildren();
  const spots = visibleSpots();
  updateAdminBar();
  updateProgress();
  renderChips(spots);
  $('empty').hidden = spots.length > 0;

  const rank = s => GROUPS.indexOf(groupOf(s));
  const shown = spots
    .filter(s => activeGroup === ALL || groupOf(s) === activeGroup)
    .map((s, i) => [s, i])
    .sort((a, b) => rank(a[0]) - rank(b[0]) || a[1] - b[1])
    .map(x => x[0]);

  let lastGroup = null;
  for (const spot of shown) {
    if (groupOf(spot) !== lastGroup) {
      lastGroup = groupOf(spot);
      const head = document.createElement('h2');
      head.className = 'groupTitle';
      head.textContent = lastGroup;
      box.append(head);
    }
    const card = document.createElement('div');
    card.className = 'card';

    const open = document.createElement('button');
    open.className = 'open';
    open.onclick = () => openSpot(spot);
    const img = document.createElement('img');
    img.src = spot.thumb || spot.src;
    img.alt = spot.title;
    img.loading = 'lazy';
    const info = document.createElement('div');
    info.className = 'info';
    const name = document.createElement('div');
    name.className = 'name';
    name.textContent = (ADMIN && /^s\d+$/.test(spot.id) ? `№ ${+spot.id.slice(1)} · ` : '') + spot.title;
    info.append(name);
    const metaText = spot.hint || '';
    if (metaText) {
      const meta = document.createElement('div');
      meta.className = 'meta';
      meta.textContent = metaText;
      info.append(meta);
    }
    if (spot.credit) {
      const credit = document.createElement('div');
      credit.className = 'credit';
      credit.textContent = spot.credit;
      info.append(credit);
    }
    const imgBox = document.createElement('div');
    imgBox.className = 'imgbox';
    imgBox.append(img);
    if (spot.year) { const y = document.createElement('span'); y.className = 'year'; y.textContent = spot.year; imgBox.append(y); }
    open.append(imgBox, info);
    card.append(open);
    card.append(cardActions(spot));

    if (ADMIN && !added.some(a => a.id === spot.id)) {
      const toggle = document.createElement('button');
      toggle.className = 'toggle';
      const paint = () => {
        const off = hiddenIds.includes(spot.id);
        card.classList.toggle('off', off);
        toggle.textContent = off ? 'Вернуть' : 'Убрать';
      };
      toggle.onclick = () => {
        hiddenIds = hiddenIds.includes(spot.id) ? hiddenIds.filter(i => i !== spot.id) : [...hiddenIds, spot.id];
        write(HIDDEN_KEY, hiddenIds);
        paint();
        updateAdminBar();
      };
      paint();
      card.append(toggle);
    }

    if (added.some(a => a.id === spot.id)) {
      const del = document.createElement('button');
      del.className = 'del';
      del.textContent = '×';
      del.setAttribute('aria-label', 'Удалить фото');
      del.onclick = () => {
        if (!confirm(`Удалить «${spot.title}»?`)) return;
        added = added.filter(a => a.id !== spot.id);
        found = found.filter(f => f !== spot.id);
        write(ADDED_KEY, added);
        write(FOUND_KEY, found);
        renderList();
      };
      card.append(del);
    }
    box.append(card);
  }
}

function loadImage(url) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = url;
  });
}

async function shrink(file, maxSide) {
  const url = URL.createObjectURL(file);
  try {
    const img = await loadImage(url);
    const k = Math.min(1, maxSide / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas');
    c.width = Math.round(img.naturalWidth * k);
    c.height = Math.round(img.naturalHeight * k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return c.toDataURL('image/jpeg', 0.8);
  } finally {
    URL.revokeObjectURL(url);
  }
}

$('addInput').onchange = async e => {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;
  let src;
  try { src = await shrink(file, 1200); }
  catch { alert('Не получилось открыть этот файл как фотографию.'); return; }
  const title = (prompt('Как называется это место?', '') || '').trim() || 'Без названия';
  const spot = { id: 'a' + Date.now(), src, title };
  if (!write(ADDED_KEY, [...added, spot])) {
    alert('Закончилось место для фотографий в браузере. Удалите одно из старых фото.');
    return;
  }
  added.push(spot);
  renderList();
};

function fit(stage, area, ratio) {
  const r = area.getBoundingClientRect();
  let w = r.width, h = w / ratio;
  if (h > r.height) { h = r.height; w = h * ratio; }
  stage.style.width = Math.floor(w) + 'px';
  stage.style.height = Math.floor(h) + 'px';
}

function refit() {
  if (!current) return;
  const img = $('oldImg');
  if (!img.naturalWidth) return;
  const ratio = img.naturalWidth / img.naturalHeight;
  if (!$('cam').hidden) fit($('camStage'), $('camArea'), ratio);
  if (!$('result').hidden) fit($('resStage'), $('resArea'), ratio);
}
addEventListener('resize', refit);

/* Сторона кнопки «снять» в горизонтальном положении: справа (по умолчанию) или слева. Запоминается. */
const HAND_KEY = 'krepost.hand';
function applyHand() {
  const left = read(HAND_KEY, 'right') === 'left';
  $('cam').classList.toggle('left', left);
  $('handSwap').textContent = left ? '⇄ Кнопка справа' : '⇄ Кнопка слева';
  requestAnimationFrame(refit);
}
$('handSwap').onclick = () => { write(HAND_KEY, read(HAND_KEY, 'right') === 'left' ? 'right' : 'left'); applyHand(); };
applyHand();
addEventListener('orientationchange', refit);

function camMessage(text) {
  $('camMsg').textContent = text || '';
  $('camMsg').hidden = !text;
}

async function startCam() {
  const token = ++camToken;
  camMessage('Включаем камеру…');
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    camMessage('Камера недоступна. Откройте приложение по защищённой ссылке (https) в обычном браузере.');
    return;
  }
  try {
    const s = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } }
    });
    if (token !== camToken) { s.getTracks().forEach(t => t.stop()); return; }
    stream = s;
    $('video').srcObject = s;
    await $('video').play();
    camMessage('');
    setupZoom(s);
  } catch (err) {
    if (token !== camToken) return;
    camMessage(err && err.name === 'NotAllowedError'
      ? 'Нет доступа к камере. Разрешите камеру в настройках браузера и откройте фото снова.'
      : 'Не получилось включить камеру.');
  }
}

function stopCam() {
  camToken++;
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = null;
  $('video').srcObject = null;
}

async function openSpot(spot) {
  current = spot;
  const img = $('oldImg');
  img.src = spot.src;
  $('camTitle').textContent = [spot.title, spot.year].filter(Boolean).join(', ');
  $('camHint').textContent = spot.hint || 'Двигайтесь, пока линии старого и нового снимка не совпадут';
  $('opacity').value = 50;
  img.style.opacity = 0.5;
  hwZoom = null; setZoom(1);
  show('cam');
  try { await img.decode(); } catch { /* размер всё равно возьмём ниже */ }
  refit();
  startCam();
}

/* Увеличение: оптический/цифровой зум камеры телефона, если он есть (Chrome на Android),
   иначе — увеличение картинки на экране; снимок обрезается так же. Ползунок 🔍 и щипок двумя пальцами. */
let zoom = 1, hwZoom = null;
function setupZoom(s) {
  hwZoom = null;
  const track = s.getVideoTracks()[0];
  const caps = track && track.getCapabilities ? track.getCapabilities() : {};
  const r = $('zoom');
  if (caps && caps.zoom && caps.zoom.max > caps.zoom.min) {
    hwZoom = { track, min: caps.zoom.min, max: Math.min(caps.zoom.max, 10) };
    r.min = hwZoom.min; r.max = hwZoom.max; r.step = caps.zoom.step || 0.1;
  } else {
    r.min = 1; r.max = 4; r.step = 0.1;
  }
  setZoom(hwZoom ? hwZoom.min : 1);
}
function setZoom(z) {
  const r = $('zoom');
  z = Math.min(+r.max, Math.max(+r.min, z));
  zoom = z;
  r.value = z;
  $('zoomVal').textContent = (Math.round(z * 10) / 10).toString().replace('.', ',') + '×';
  if (hwZoom) {
    $('video').style.transform = '';
    hwZoom.track.applyConstraints({ advanced: [{ zoom: z }] }).catch(() => {});
  } else {
    $('video').style.transform = z > 1 ? `scale(${z})` : '';
  }
}
$('zoom').oninput = e => setZoom(+e.target.value);
{
  let startDist = 0, startZoom = 1;
  const dist = t => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
  $('camStage').addEventListener('touchstart', e => {
    if (e.touches.length === 2) { startDist = dist(e.touches); startZoom = zoom; }
  }, { passive: true });
  $('camStage').addEventListener('touchmove', e => {
    if (e.touches.length === 2 && startDist) { e.preventDefault(); setZoom(startZoom * dist(e.touches) / startDist); }
  }, { passive: false });
  $('camStage').addEventListener('touchend', e => { if (e.touches.length < 2) startDist = 0; });
}

$('opacity').oninput = e => { $('oldImg').style.opacity = e.target.value / 100; };

$('camBack').onclick = () => { stopCam(); current = null; show('list'); renderList(); };
$('resBack').onclick = () => { current = null; show('list'); renderList(); };
$('retry').onclick = () => { if (current) openSpot(current); };

function setCompare(value) {
  $('cmpOld').style.clipPath = `inset(0 ${100 - value}% 0 0)`;
  $('cmpLine').style.left = value + '%';
}
$('cmpRange').oninput = e => setCompare(+e.target.value);

$('shoot').onclick = () => {
  const video = $('video'), img = $('oldImg');
  if (!video.videoWidth || !img.naturalWidth) return;
  const W = img.naturalWidth, H = img.naturalHeight;
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  /* Обрезаем кадр камеры так же, как он виден на экране */
  const k = Math.max(W / video.videoWidth, H / video.videoHeight);
  const dz = hwZoom ? 1 : zoom; // цифровое увеличение — обрезаем середину кадра
  const sw = W / k / dz, sh = H / k / dz;
  c.getContext('2d').drawImage(video, (video.videoWidth - sw) / 2, (video.videoHeight - sh) / 2, sw, sh, 0, 0, W, H);
  nowUrl = c.toDataURL('image/jpeg', 0.88);
  stopCam();
  // в «Мою библиотеку»
  const shotSpot = current;
  c.toBlob(blob => {
    if (!blob) return;
    libAdd({ spotId: shotSpot.id, title: shotSpot.title, year: shotSpot.year || '', src: shotSpot.src, at: Date.now(), now: blob })
      .then(updateLibCount)
      .catch(() => alert('Не получилось сохранить снимок в библиотеку: закончилось место в телефоне.'));
  }, 'image/jpeg', 0.88);

  if (!found.includes(current.id)) { found.push(current.id); write(FOUND_KEY, found); }
  $('cmpNow').src = nowUrl;
  $('cmpOld').src = current.src;
  $('resTitle').textContent = current.title;
  $('cmpRange').value = 50;
  setCompare(50);
  show('result');
  refit();
};

function label(ctx, text, x, y) {
  ctx.font = `600 ${Math.round(y / 22)}px system-ui,sans-serif`;
  const pad = y / 90;
  const w = ctx.measureText(text).width;
  const h = y / 16;
  ctx.fillStyle = 'rgba(0,0,0,.65)';
  ctx.fillRect(x, y - h - pad * 2, w + pad * 2, h);
  ctx.fillStyle = '#fff';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, x + pad, y - h / 2 - pad * 2);
}

async function pairBlob() {
  const [oldI, nowI] = await Promise.all([loadImage(current.src), loadImage(nowUrl)]);
  const W = oldI.naturalWidth, H = oldI.naturalHeight;
  const c = document.createElement('canvas');
  c.width = W * 2; c.height = H;
  const ctx = c.getContext('2d');
  ctx.drawImage(oldI, 0, 0, W, H);
  ctx.drawImage(nowI, W, 0, W, H);
  label(ctx, current.year ? `Тогда · ${current.year}` : 'Тогда', H / 60, H);
  label(ctx, 'Сейчас', W + H / 60, H);

  try { return await new Promise(r => c.toBlob(r, 'image/jpeg', 0.9)); }
  catch { alert('Сохранение работает, когда приложение открыто по ссылке, а не как файл с компьютера.'); return null; }
}
function downloadBlob(blob) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'krepost-togda-i-seichas.jpg';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}
$('save').onclick = async () => { const blob = await pairBlob(); if (blob) downloadBlob(blob); };
$('share').onclick = async () => {
  const blob = await pairBlob();
  if (!blob) return;
  const file = new File([blob], 'krepost-togda-i-seichas.jpg', { type: 'image/jpeg' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: current.title }); return; }
    catch (err) { if (err.name === 'AbortError') return; }
  }
  downloadBlob(blob);
};
$('toList').onclick = () => $('resBack').click();

/* «Скачать на телефон»: установка как приложение */
let installEvt = null;
const isStandalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
if (!isStandalone()) $('installBox').hidden = false;
addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; });
addEventListener('appinstalled', () => { $('installBox').hidden = true; });
$('installBtn').onclick = async () => {
  if (installEvt) {
    const ev = installEvt;
    installEvt = null;
    ev.prompt();
    try { if ((await ev.userChoice).outcome === 'accepted') $('installBox').hidden = true; } catch {}
    return;
  }
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
  $('installHelp').textContent = ios
    ? 'На iPhone: откройте эту страницу в Safari, нажмите «Поделиться» (квадрат со стрелкой вверх) и выберите «На экран „Домой“».'
    : 'Откройте меню браузера (три точки ⋮) и выберите «Установить приложение» или «Добавить на главный экран».';
  $('installHelp').hidden = false;
};
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').then(reg => {
    // вернулись в приложение — проверить, нет ли новой версии
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') reg.update().catch(() => {}); });
  }).catch(() => {});
}

/* Кнопка добавления нужна только пока своих точек нет */
if (SPOTS.length) document.querySelector('label[for=addInput]').hidden = true;
renderList();
</script>
