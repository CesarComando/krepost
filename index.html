<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Крепость сквозь время</title>
<link rel="icon" href="data:,">
<style>
  :root { --bg:#17130f; --panel:#262019; --line:#40362a; --text:#f2e8d8; --muted:#b5a68f; --accent:#d9a441; --ok:#8fbf6a; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--text); font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  button,label.btn { font:inherit; cursor:pointer; border:0; border-radius:10px; padding:12px 16px; background:var(--panel); color:var(--text); display:inline-block; text-align:center; }
  button.main,label.btn { background:var(--accent); color:#1d1608; font-weight:600; }
  .screen { height:100dvh; display:flex; flex-direction:column; }
  .screen[hidden] { display:none; }

  #list { overflow-y:auto; padding:20px 16px 32px; }
  #list h1 { font:600 28px/1.15 Georgia,"Times New Roman",serif; margin:0 0 6px; }
  #list .sub { color:var(--muted); margin:0 0 4px; }
  #progress { color:var(--accent); margin:0 0 16px; font-weight:600; }
  #cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:14px; margin-bottom:18px; }
  .card { position:relative; background:var(--panel); border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  .card .open { display:block; width:100%; padding:0; border-radius:0; background:none; text-align:left; }
  .card img { display:block; width:100%; height:170px; object-fit:cover; filter:sepia(.35); }
  .card .info { padding:10px 12px 12px; }
  .card .name { font-weight:600; }
  .card .meta { color:var(--muted); font-size:14px; }
  .card .credit { color:var(--muted); font-size:12px; opacity:.8; margin-top:4px; }
  .card .done { color:var(--ok); font-size:14px; font-weight:600; }
  .card .del { position:absolute; top:6px; right:6px; width:34px; height:34px; padding:0; border-radius:50%; background:rgba(0,0,0,.65); }
  #empty { color:var(--muted); padding:28px 16px; border:1px dashed var(--line); border-radius:12px; text-align:center; margin-bottom:18px; }
  label.btn[hidden] { display:none; }
  #adminBar { position:sticky; top:-20px; z-index:5; display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 12px; margin-bottom:14px; background:var(--panel); border:1px solid var(--accent); border-radius:10px; font-weight:600; }
  #adminBar[hidden] { display:none; }
  .card.off { opacity:.35; }
  .card .toggle { position:absolute; top:6px; right:6px; padding:8px 12px; font-size:14px; background:rgba(0,0,0,.75); }
  #addInput { position:absolute; opacity:0; width:1px; height:1px; }

  .bar { display:flex; align-items:center; gap:10px; padding:10px 12px; background:var(--bg); }
  .bar .title { flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-weight:600; }
  #camArea,#resArea { flex:1; min-height:0; display:flex; align-items:center; justify-content:center; background:#000; }
  .stage { position:relative; overflow:hidden; background:#000; }
  .stage video,.stage img { position:absolute; inset:0; width:100%; height:100%; display:block; }
  .stage video { object-fit:cover; }
  .stage img { object-fit:fill; }
  #camMsg { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; padding:20px; text-align:center; background:rgba(0,0,0,.72); }
  #camMsg[hidden] { display:none; }
  .controls { padding:10px 16px calc(14px + env(safe-area-inset-bottom)); background:var(--bg); }
  .controls .row { display:flex; align-items:center; gap:10px; color:var(--muted); font-size:14px; }
  .controls input[type=range] { flex:1; accent-color:var(--accent); height:32px; }
  .controls .hint { color:var(--muted); font-size:14px; text-align:center; margin:2px 0 10px; }
  .actions { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
  #shoot { min-width:190px; }
  #cmpRange { position:absolute; inset:0; width:100%; height:100%; margin:0; opacity:0; cursor:ew-resize; }
  #cmpLine { position:absolute; top:0; bottom:0; width:2px; background:var(--accent); pointer-events:none; }
  .tag { position:absolute; bottom:8px; padding:2px 8px; border-radius:6px; background:rgba(0,0,0,.65); font-size:13px; pointer-events:none; }
</style>
</head>
<body>

<section id="list" class="screen">
  <h1>Крепость сквозь время</h1>
  <p class="sub">Найди в Даугавпилсской крепости место со старой фотографии и встань точно туда, откуда снимал фотограф.</p>
  <p id="progress"></p>
  <div id="adminBar" hidden>
    <span id="adminCount"></span>
    <button id="adminCopy">Скопировать список</button>
  </div>
  <div id="cards"></div>
  <div id="empty" hidden>Пока нет ни одного фото. Добавьте старый снимок, чтобы попробовать.</div>
  <label class="btn" for="addInput">+ Добавить старое фото</label>
  <input id="addInput" type="file" accept="image/*">
</section>

<section id="cam" class="screen" hidden>
  <div class="bar">
    <button id="camBack" aria-label="Назад">←</button>
    <div class="title" id="camTitle"></div>
  </div>
  <div id="camArea">
    <div class="stage" id="camStage">
      <video id="video" playsinline muted autoplay></video>
      <img id="oldImg" alt="Старая фотография">
      <div id="camMsg" hidden></div>
    </div>
  </div>
  <div class="controls">
    <p class="hint" id="camHint"></p>
    <div class="row">
      <span>Сейчас</span>
      <input id="opacity" type="range" min="0" max="100" value="50" aria-label="Прозрачность старого фото">
      <span>Тогда</span>
    </div>
    <div class="actions"><button id="shoot" class="main">Совпало — снять</button></div>
  </div>
</section>

<section id="result" class="screen" hidden>
  <div class="bar">
    <button id="resBack" aria-label="К списку">←</button>
    <div class="title" id="resTitle"></div>
  </div>
  <div id="resArea">
    <div class="stage" id="resStage">
      <img id="cmpNow" alt="Снимок сейчас">
      <img id="cmpOld" alt="Старая фотография">
      <div id="cmpLine"></div>
      <span class="tag" style="left:8px">Тогда</span>
      <span class="tag" style="right:8px">Сейчас</span>
      <input id="cmpRange" type="range" min="0" max="100" value="50" aria-label="Сравнение тогда и сейчас">
    </div>
  </div>
  <div class="controls">
    <p class="hint">Проведите по снимку, чтобы сравнить</p>
    <div class="actions">
      <button id="save" class="main">Сохранить</button>
      <button id="retry">Переснять</button>
    </div>
  </div>
</section>

<script src="spots.js"></script>
<script>
/* Точки маршрута лежат в spots.js, снимки — в папке photos. */
const SPOTS = window.SPOTS_DATA || [];

const ADDED_KEY = 'krepost.added', FOUND_KEY = 'krepost.found';
const $ = id => document.getElementById(id);

function read(key, fallback) {
  try { return JSON.parse(localStorage.getItem(key)) || fallback; } catch { return fallback; }
}
function write(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); return true; } catch { return false; }
}

let added = read(ADDED_KEY, []);
let found = read(FOUND_KEY, []);
let current = null, stream = null, nowUrl = null, camToken = 0;

/* Режим админа: открыть сайт с ?admin=1. Скрывает снимки только в этом браузере. */
const HIDDEN_KEY = 'krepost.hidden';
const ADMIN = new URLSearchParams(location.search).has('admin');
let hiddenIds = read(HIDDEN_KEY, []).filter(id => SPOTS.some(s => s.id === id));

function updateAdminBar() {
  if (!ADMIN) return;
  $('adminBar').hidden = false;
  $('adminCount').textContent = `Убрано: ${hiddenIds.length} из ${allSpots().length}`;
}

$('adminCopy').onclick = async () => {
  const text = hiddenIds.length ? 'Убрать из приложения: ' + hiddenIds.join(', ') : 'Ничего не убрано';
  try {
    await navigator.clipboard.writeText(text);
    $('adminCopy').textContent = 'Скопировано';
    setTimeout(() => { $('adminCopy').textContent = 'Скопировать список'; }, 2000);
  } catch {
    prompt('Скопируйте этот список:', text);
  }
};

const allSpots = () => [...SPOTS, ...added];

function show(id) {
  for (const s of document.querySelectorAll('.screen')) s.hidden = s.id !== id;
}

function renderList() {
  const box = $('cards');
  box.replaceChildren();
  const spots = allSpots().filter(s => ADMIN || !hiddenIds.includes(s.id));
  updateAdminBar();
  $('empty').hidden = spots.length > 0;
  const doneCount = spots.filter(s => found.includes(s.id)).length;
  $('progress').textContent = spots.length ? `Найдено: ${doneCount} из ${spots.length}` : '';

  for (const spot of spots) {
    const card = document.createElement('div');
    card.className = 'card';

    const open = document.createElement('button');
    open.className = 'open';
    open.onclick = () => openSpot(spot);
    const img = document.createElement('img');
    img.src = spot.thumb || spot.src;
    img.alt = spot.title;
    img.loading = 'lazy';
    const info = document.createElement('div');
    info.className = 'info';
    const name = document.createElement('div');
    name.className = 'name';
    name.textContent = spot.title;
    info.append(name);
    const metaText = [spot.year, spot.hint].filter(Boolean).join(' · ');
    if (metaText) {
      const meta = document.createElement('div');
      meta.className = 'meta';
      meta.textContent = metaText;
      info.append(meta);
    }
    if (spot.credit) {
      const credit = document.createElement('div');
      credit.className = 'credit';
      credit.textContent = spot.credit;
      info.append(credit);
    }
    if (found.includes(spot.id)) {
      const done = document.createElement('div');
      done.className = 'done';
      done.textContent = '✓ Найдено';
      info.append(done);
    }
    open.append(img, info);
    card.append(open);

    if (ADMIN && !added.some(a => a.id === spot.id)) {
      const toggle = document.createElement('button');
      toggle.className = 'toggle';
      const paint = () => {
        const off = hiddenIds.includes(spot.id);
        card.classList.toggle('off', off);
        toggle.textContent = off ? 'Вернуть' : 'Убрать';
      };
      toggle.onclick = () => {
        hiddenIds = hiddenIds.includes(spot.id) ? hiddenIds.filter(i => i !== spot.id) : [...hiddenIds, spot.id];
        write(HIDDEN_KEY, hiddenIds);
        paint();
        updateAdminBar();
      };
      paint();
      card.append(toggle);
    }

    if (added.some(a => a.id === spot.id)) {
      const del = document.createElement('button');
      del.className = 'del';
      del.textContent = '×';
      del.setAttribute('aria-label', 'Удалить фото');
      del.onclick = () => {
        if (!confirm(`Удалить «${spot.title}»?`)) return;
        added = added.filter(a => a.id !== spot.id);
        found = found.filter(f => f !== spot.id);
        write(ADDED_KEY, added);
        write(FOUND_KEY, found);
        renderList();
      };
      card.append(del);
    }
    box.append(card);
  }
}

function loadImage(url) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = url;
  });
}

async function shrink(file, maxSide) {
  const url = URL.createObjectURL(file);
  try {
    const img = await loadImage(url);
    const k = Math.min(1, maxSide / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas');
    c.width = Math.round(img.naturalWidth * k);
    c.height = Math.round(img.naturalHeight * k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return c.toDataURL('image/jpeg', 0.8);
  } finally {
    URL.revokeObjectURL(url);
  }
}

$('addInput').onchange = async e => {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;
  let src;
  try { src = await shrink(file, 1200); }
  catch { alert('Не получилось открыть этот файл как фотографию.'); return; }
  const title = (prompt('Как называется это место?', '') || '').trim() || 'Без названия';
  const spot = { id: 'a' + Date.now(), src, title };
  if (!write(ADDED_KEY, [...added, spot])) {
    alert('Закончилось место для фотографий в браузере. Удалите одно из старых фото.');
    return;
  }
  added.push(spot);
  renderList();
};

function fit(stage, area, ratio) {
  const r = area.getBoundingClientRect();
  let w = r.width, h = w / ratio;
  if (h > r.height) { h = r.height; w = h * ratio; }
  stage.style.width = Math.floor(w) + 'px';
  stage.style.height = Math.floor(h) + 'px';
}

function refit() {
  if (!current) return;
  const img = $('oldImg');
  if (!img.naturalWidth) return;
  const ratio = img.naturalWidth / img.naturalHeight;
  if (!$('cam').hidden) fit($('camStage'), $('camArea'), ratio);
  if (!$('result').hidden) fit($('resStage'), $('resArea'), ratio);
}
addEventListener('resize', refit);
addEventListener('orientationchange', refit);

function camMessage(text) {
  $('camMsg').textContent = text || '';
  $('camMsg').hidden = !text;
}

async function startCam() {
  const token = ++camToken;
  camMessage('Включаем камеру…');
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    camMessage('Камера недоступна. Откройте приложение по защищённой ссылке (https) в обычном браузере.');
    return;
  }
  try {
    const s = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } }
    });
    if (token !== camToken) { s.getTracks().forEach(t => t.stop()); return; }
    stream = s;
    $('video').srcObject = s;
    await $('video').play();
    camMessage('');
  } catch (err) {
    if (token !== camToken) return;
    camMessage(err && err.name === 'NotAllowedError'
      ? 'Нет доступа к камере. Разрешите камеру в настройках браузера и откройте фото снова.'
      : 'Не получилось включить камеру.');
  }
}

function stopCam() {
  camToken++;
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = null;
  $('video').srcObject = null;
}

async function openSpot(spot) {
  current = spot;
  const img = $('oldImg');
  img.src = spot.src;
  $('camTitle').textContent = [spot.title, spot.year].filter(Boolean).join(', ');
  $('camHint').textContent = spot.hint || 'Двигайтесь, пока линии старого и нового снимка не совпадут';
  $('opacity').value = 50;
  img.style.opacity = 0.5;
  show('cam');
  try { await img.decode(); } catch { /* размер всё равно возьмём ниже */ }
  refit();
  startCam();
}

$('opacity').oninput = e => { $('oldImg').style.opacity = e.target.value / 100; };

$('camBack').onclick = () => { stopCam(); current = null; show('list'); renderList(); };
$('resBack').onclick = () => { current = null; show('list'); renderList(); };
$('retry').onclick = () => { if (current) openSpot(current); };

function setCompare(value) {
  $('cmpOld').style.clipPath = `inset(0 ${100 - value}% 0 0)`;
  $('cmpLine').style.left = value + '%';
}
$('cmpRange').oninput = e => setCompare(+e.target.value);

$('shoot').onclick = () => {
  const video = $('video'), img = $('oldImg');
  if (!video.videoWidth || !img.naturalWidth) return;
  const W = img.naturalWidth, H = img.naturalHeight;
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  /* Обрезаем кадр камеры так же, как он виден на экране */
  const k = Math.max(W / video.videoWidth, H / video.videoHeight);
  const sw = W / k, sh = H / k;
  c.getContext('2d').drawImage(video, (video.videoWidth - sw) / 2, (video.videoHeight - sh) / 2, sw, sh, 0, 0, W, H);
  nowUrl = c.toDataURL('image/jpeg', 0.88);
  stopCam();

  if (!found.includes(current.id)) { found.push(current.id); write(FOUND_KEY, found); }
  $('cmpNow').src = nowUrl;
  $('cmpOld').src = current.src;
  $('resTitle').textContent = current.title;
  $('cmpRange').value = 50;
  setCompare(50);
  show('result');
  refit();
};

function label(ctx, text, x, y) {
  ctx.font = `600 ${Math.round(y / 22)}px system-ui,sans-serif`;
  const pad = y / 90;
  const w = ctx.measureText(text).width;
  const h = y / 16;
  ctx.fillStyle = 'rgba(0,0,0,.65)';
  ctx.fillRect(x, y - h - pad * 2, w + pad * 2, h);
  ctx.fillStyle = '#fff';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, x + pad, y - h / 2 - pad * 2);
}

$('save').onclick = async () => {
  const [oldI, nowI] = await Promise.all([loadImage(current.src), loadImage(nowUrl)]);
  const W = oldI.naturalWidth, H = oldI.naturalHeight;
  const c = document.createElement('canvas');
  c.width = W * 2; c.height = H;
  const ctx = c.getContext('2d');
  ctx.drawImage(oldI, 0, 0, W, H);
  ctx.drawImage(nowI, W, 0, W, H);
  label(ctx, current.year ? `Тогда · ${current.year}` : 'Тогда', H / 60, H);
  label(ctx, 'Сейчас', W + H / 60, H);

  let blob;
  try { blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.9)); }
  catch { alert('Сохранение работает, когда приложение открыто по ссылке, а не как файл с компьютера.'); return; }
  const file = new File([blob], 'krepost-togda-i-seichas.jpg', { type: 'image/jpeg' });
  const isTouch = matchMedia('(pointer: coarse)').matches;
  if (isTouch && navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: current.title }); return; }
    catch (err) { if (err.name === 'AbortError') return; }
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = file.name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
};

/* Кнопка добавления нужна только пока своих точек нет */
if (SPOTS.length) document.querySelector('label[for=addInput]').hidden = true;
renderList();
</script>
</body>
</html>
