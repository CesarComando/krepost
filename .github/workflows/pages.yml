# Выкладка сайта через GitHub Actions (надёжнее, чем встроенная сборка Pages, которая зависала в очереди).
# Требует: Settings → Pages → Source = «GitHub Actions».
name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Собрать сайт (только нужные файлы)
        run: |
          mkdir _site
          # ВАЖНО: на сайт попадает только то, что перечислено здесь. Новый файл или папку приложения — дописать в список,
          # иначе на сайте его не будет (так 19.11 пропал аудиогид: guide.js и audio/ не были в списке).
          cp -r index.html spots.js quests.js history.js guide.js guide-*.js i18n.js i18n-*.js sw.js manifest.webmanifest icons photos audio vendor _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
